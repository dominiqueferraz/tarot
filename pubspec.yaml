name: tarot_squared
description: "A tarot puzzle game for iOS and Android."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.2.4
  flutter_localizations:
    sdk: flutter
  intl: any
  material_ui: ^1.11.1
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  config:
    # The iOS host already uses UIScene with its own Info.plist location.
    enable-uiscene-migration: false
  generate: true
  uses-material-design: true
  assets:
    - assets/the-moon.webp
    - assets/paper-grain.png
    - assets/puzzles/
    - assets/art/
